name: Build Sentinel Armor
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Fabric project from repository source files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p buildsrc/src/main/java/com/voidwarden/client
          mkdir -p buildsrc/src/main/java/com/voidwarden/mixin
          mkdir -p buildsrc/src/main/resources/assets/voidwarden/{equipment,lang,items,models/item,textures/item,textures/entity/cape,textures/entity/equipment/humanoid,textures/entity/equipment/humanoid_leggings}
          mkdir -p buildsrc/src/main/resources/data/voidwarden/{recipe,tags/item}
          cp build.gradle settings.gradle gradle.properties fabric.mod.json voidwarden.mixins.json buildsrc/
          cp VoidWarden.java ModItems.java buildsrc/src/main/java/com/voidwarden/
          cp VoidWardenClient.java VoidCapeLayer.java buildsrc/src/main/java/com/voidwarden/client/
          cp SmithingMenuMixin.java buildsrc/src/main/java/com/voidwarden/mixin/
          cp en_us.json buildsrc/src/main/resources/assets/voidwarden/lang/
          cp voidwarden.json buildsrc/src/main/resources/assets/voidwarden/equipment/
          cp voidwarden_helmet.json voidwarden_chestplate.json voidwarden_leggings.json voidwarden_boots.json voidwarden_ingot.json voidwarden_nugget.json buildsrc/src/main/resources/assets/voidwarden/items/
          cp "voidwarden_helmet (3).json" buildsrc/src/main/resources/assets/voidwarden/models/item/voidwarden_helmet.json
          cp "voidwarden_chestplate (2).json" buildsrc/src/main/resources/assets/voidwarden/models/item/voidwarden_chestplate.json
          cp "voidwarden_leggings (5).json" buildsrc/src/main/resources/assets/voidwarden/models/item/voidwarden_leggings.json
          cp "voidwarden_boots (6).json" buildsrc/src/main/resources/assets/voidwarden/models/item/voidwarden_boots.json
          cp "voidwarden_ingot (1).json" buildsrc/src/main/resources/assets/voidwarden/models/item/voidwarden_ingot.json
          cp "voidwarden_nugget (4).json" buildsrc/src/main/resources/assets/voidwarden/models/item/voidwarden_nugget.json
          cp voidwarden_helmet.png voidwarden_chestplate.png voidwarden_leggings.png voidwarden_boots.png voidwarden_ingot.png voidwarden_nugget.png buildsrc/src/main/resources/assets/voidwarden/textures/item/
          cp voidwarden_cape.png buildsrc/src/main/resources/assets/voidwarden/textures/entity/cape/
          cp voidwarden.png buildsrc/src/main/resources/assets/voidwarden/textures/entity/equipment/humanoid/
          cp "voidwarden (7).png" buildsrc/src/main/resources/assets/voidwarden/textures/entity/equipment/humanoid_leggings/
          cp "voidwarden_ingot (8).json" buildsrc/src/main/resources/data/voidwarden/recipe/voidwarden_ingot.json
          cp "voidwarden_helmet (10).json" buildsrc/src/main/resources/data/voidwarden/recipe/voidwarden_helmet.json
          cp "voidwarden_chestplate (9).json" buildsrc/src/main/resources/data/voidwarden/recipe/voidwarden_chestplate.json
          cp "voidwarden_leggings (11).json" buildsrc/src/main/resources/data/voidwarden/recipe/voidwarden_leggings.json
          cp "voidwarden_boots (12).json" buildsrc/src/main/resources/data/voidwarden/recipe/voidwarden_boots.json
          cp repairs_voidwarden_armor.json buildsrc/src/main/resources/data/voidwarden/tags/item/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build mod (capture diagnostics)
        working-directory: buildsrc
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-build-diagnostics
          path: buildsrc/build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sentinel-armor-minecraft-26.3
          path: buildsrc/build/libs/*.jar
          if-no-files-found: error
