name: Build Sentinel Armor
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f sentinel-source-upload.zip || {
            echo "::error::sentinel-source-upload.zip is missing from the repository root."
            exit 1
          }

      - name: Extract mod source
        run: unzip -q sentinel-source-upload.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build mod
        working-directory: voidwarden
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-armor-minecraft-26.3
          path: voidwarden/build/libs/*.jar
          if-no-files-found: error
