name: Build Voidwarden Sentinel Replacement
on:
  push:
    branches: [main, 'upgrade/**', 'feature/add-sentinel-armor-set']
  pull_request:
    branches: [main, 'upgrade/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Assemble mod sources and Sentinel assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p buildsrc/src/main/java/com/voidwarden/client
          mkdir -p buildsrc/src/main/java/com/voidwarden/mixin
          mkdir -p buildsrc/src/main/resources/assets/voidwarden/{equipment,lang,items,models/item,textures/item,textures/entity/cape,textures/entity/sentinel,textures/entity/equipment/humanoid,textures/entity/equipment/humanoid_leggings}
          mkdir -p buildsrc/src/main/resources/data/voidwarden/{recipe,tags/item}
          cp build.gradle settings.gradle gradle.properties buildsrc/
          cp fabric.mod.json voidwarden.mixins.json buildsrc/src/main/resources/
          cp VoidWarden.java ModItems.java buildsrc/src/main/java/com/voidwarden/
          cp VoidWardenClient.java VoidCapeLayer.java SentinelArmorClient.java SentinelArmorLayer.java SentinelModel.java buildsrc/src/main/java/com/voidwarden/client/
          cp SmithingMenuMixin.java buildsrc/src/main/java/com/voidwarden/mixin/
          cp en_us.json buildsrc/src/main/resources/assets/voidwarden/lang/
          cp sentinel_equipment.json buildsrc/src/main/resources/assets/voidwarden/equipment/voidwarden.json
          cp sentinel_helmet_item.json buildsrc/src/main/resources/assets/voidwarden/items/voidwarden_helmet.json
          cp sentinel_chestplate_item.json buildsrc/src/main/resources/assets/voidwarden/items/voidwarden_chestplate.json
          cp sentinel_leggings_item.json buildsrc/src/main/resources/assets/voidwarden/items/voidwarden_leggings.json
          cp sentinel_boots_item.json buildsrc/src/main/resources/assets/voidwarden/items/voidwarden_boots.json
          cp "voidwarden_helmet (3).json" buildsrc/src/main/resources/assets/voidwarden/models/item/voidwarden_helmet.json
          cp "voidwarden_chestplate (2).json" buildsrc/src/main/resources/assets/voidwarden/models/item/voidwarden_chestplate.json
          cp "voidwarden_leggings (5).json" buildsrc/src/main/resources/assets/voidwarden/models/item/voidwarden_leggings.json
          cp "voidwarden_boots (6).json" buildsrc/src/main/resources/assets/voidwarden/models/item/voidwarden_boots.json
          cp voidwarden_helmet.png voidwarden_chestplate.png voidwarden_leggings.png voidwarden_boots.png buildsrc/src/main/resources/assets/voidwarden/textures/item/
          cp voidwarden_cape.png buildsrc/src/main/resources/assets/voidwarden/textures/entity/cape/
          cp voidwarden.png buildsrc/src/main/resources/assets/voidwarden/textures/entity/equipment/humanoid/
          cp "voidwarden (7).png" buildsrc/src/main/resources/assets/voidwarden/textures/entity/equipment/humanoid_leggings/voidwarden.png
          cp sentinel_gear.png buildsrc/src/main/resources/assets/voidwarden/textures/entity/sentinel/sentinel_gear.png
          cp sentinel_humanoid.png buildsrc/src/main/resources/assets/voidwarden/textures/entity/equipment/humanoid/voidwarden.png
          cp sentinel_leggings_layer.png buildsrc/src/main/resources/assets/voidwarden/textures/entity/equipment/humanoid_leggings/voidwarden.png
          cp sentinel_item_helmet.png buildsrc/src/main/resources/assets/voidwarden/textures/item/voidwarden_helmet.png
          cp sentinel_item_chestplate.png buildsrc/src/main/resources/assets/voidwarden/textures/item/voidwarden_chestplate.png
          cp sentinel_item_leggings.png buildsrc/src/main/resources/assets/voidwarden/textures/item/voidwarden_leggings.png
          cp sentinel_item_boots.png buildsrc/src/main/resources/assets/voidwarden/textures/item/voidwarden_boots.png
          cp "voidwarden_ingot (8).json" buildsrc/src/main/resources/data/voidwarden/recipe/voidwarden_ingot.json
          cp "voidwarden_helmet (10).json" buildsrc/src/main/resources/data/voidwarden/recipe/voidwarden_helmet.json
          cp "voidwarden_chestplate (9).json" buildsrc/src/main/resources/data/voidwarden/recipe/voidwarden_chestplate.json
          cp "voidwarden_leggings (11).json" buildsrc/src/main/resources/data/voidwarden/recipe/voidwarden_leggings.json
          cp "voidwarden_boots (12).json" buildsrc/src/main/resources/data/voidwarden/recipe/voidwarden_boots.json
          cp repairs_voidwarden_armor.json buildsrc/src/main/resources/data/voidwarden/tags/item/
      - name: Build mod
        working-directory: buildsrc
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: voidwarden-sentinel-minecraft-26.3
          path: buildsrc/build/libs/*.jar
          if-no-files-found: error
